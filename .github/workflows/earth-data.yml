# Refreshes the data snapshot for the static (GitHub Pages) version of the Earth Observatory:
# worldwide airport observations (NOAA AWC bulk METAR file) and the ECMWF IFS run time (Open-Meteo metadata).
# Neither source allows direct browser requests (no CORS), so a copy is published on the `data` branch and read
# through raw.githubusercontent.com. The branch is replaced by a single commit each time, so history does not grow.
name: Earth Observatory — data snapshot

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earth-data
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: earth-observatory/scripts
      - name: Download and tile
        run: python3 -I earth-observatory/scripts/data_snapshot.py "$RUNNER_TEMP/snapshot"
      - name: Replace the data branch
        working-directory: ${{ runner.temp }}/snapshot
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
